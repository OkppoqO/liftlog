<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>LiftLog 重訓紀錄器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  --bg:#0d0f12;--surface:#16191e;--surface2:#1e2229;--border:#2a2f37;
  --text:#eef1f5;--muted:#8a93a2;--accent:#b6ff3b;--accent-dim:rgba(182,255,59,.14);
  --danger:#ff5f5f;--gold:#ffc94d;--radius:16px;
  --num:'Barlow Condensed',system-ui,sans-serif;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:'Noto Sans TC',system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:110px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}

/* Header */
.app-header{max-width:560px;margin:0 auto;padding:20px 16px 4px;display:flex;align-items:baseline;gap:10px}
.logo{font-family:var(--num);font-size:32px;font-weight:700;letter-spacing:.5px;line-height:1}
.logo span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
main{max-width:560px;margin:0 auto;padding:0 16px}
.tab{display:none;animation:fade .25s ease}
.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0}
h2{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2::before{content:'';width:4px;height:16px;background:var(--accent);border-radius:2px;flex:none}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.card-head h2{margin:0}

/* Form */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent)}
.row.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.pick{display:grid;grid-template-columns:1fr 1.8fr;gap:10px}
.stepper{display:flex;gap:4px}
.stepper input{text-align:center;font-family:var(--num);font-size:22px;font-weight:600;padding:6px 0;min-width:0}
.stepper button{flex:0 0 34px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:20px;cursor:pointer}
.stepper button:active{background:var(--accent-dim);border-color:var(--accent)}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.hint b{color:var(--text);font-weight:500}
.error{color:var(--danger);font-size:13px;margin-bottom:8px}
.error:empty{display:none}

/* Buttons */
.btn{border:none;border-radius:12px;padding:13px 12px;white-space:nowrap;font-size:15px;font-weight:700;cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.08)}
.btn.primary{background:var(--accent);color:#0d0f12}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:rgba(255,95,95,.1);color:var(--danger);border:1px solid rgba(255,95,95,.35)}
.btn-row{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small-select{width:auto;max-width:55%;padding:8px 10px;font-size:14px}

/* History */
.day{margin-bottom:14px}
.day-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 2px 6px;border-bottom:1px dashed var(--border);margin-bottom:4px}
.day-head b{color:var(--text)}
.set-row{display:flex;align-items:center;gap:6px;padding:8px 6px;border-radius:10px}
.set-row+.set-row{border-top:1px solid rgba(255,255,255,.04)}
.set-row.flash{animation:flash 1.4s ease}
@keyframes flash{0%{background:var(--accent-dim)}100%{background:transparent}}
.set-main{flex:1;min-width:0}
.set-ex{font-weight:500;font-size:14px}
.set-meta{font-family:var(--num);font-size:21px;font-weight:600;line-height:1.2}
.set-meta .e{font-family:inherit;font-size:14px;color:var(--muted);font-weight:500;margin-left:6px}
.set-note{font-size:12px;color:var(--muted)}
.pr{font-size:11px;color:var(--gold);background:rgba(255,201,77,.12);border:1px solid rgba(255,201,77,.35);border-radius:999px;padding:0 7px;margin-left:6px;font-weight:700;white-space:nowrap}
.icon-btn{background:none;border:none;color:var(--muted);font-size:16px;width:36px;height:36px;border-radius:10px;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.empty-block{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}

/* Progress */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;color:var(--muted);padding:9px 4px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.seg button.active{background:var(--accent);color:#0d0f12}
.chart-wrap{position:relative;height:260px}
.chart-wrap .empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:0 20px}
.chart-wrap.is-empty .empty{display:flex}
.chart-wrap.is-empty canvas{visibility:hidden}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.stat .label{font-size:12px;color:var(--muted)}
.stat .val{font-family:var(--num);font-size:26px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .val small{font-size:14px;color:var(--muted);margin-left:2px;font-weight:500}
.summary .stat .val{font-size:22px;text-overflow:clip}
.more-btn{width:100%;margin-top:4px}
.up{color:var(--accent)}.down{color:var(--danger)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 1RM */
.calc-out{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.calc-hero{grid-column:1/-1;text-align:center;background:var(--accent-dim);border:1px solid rgba(182,255,59,.3);border-radius:14px;padding:14px}
.calc-hero .val{font-family:var(--num);font-size:58px;font-weight:700;color:var(--accent);line-height:1}
.calc-hero .val small{font-size:20px;margin-left:4px}
.calc-hero .label{font-size:13px;color:var(--muted)}
.warn{background:rgba(255,201,77,.1);color:var(--gold);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.muted-note{font-size:12px;color:var(--muted);margin-top:10px}

/* Table */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--border)}
td{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
td.num{font-family:var(--num);font-size:18px;font-weight:600}
td .sm{font-size:12px;color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-weight:400}
tr.hl td{color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--accent);opacity:.75}

/* Custom exercises */
.add-ex{display:grid;grid-template-columns:1fr 92px 64px;gap:8px}
.add-ex select,.add-ex input{padding:10px}
.add-ex .btn{padding:10px 0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px}
.tag em{font-style:normal;color:var(--muted);font-size:11px}
.tag button{background:none;border:none;color:var(--muted);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px}
.tag button:hover{background:rgba(255,95,95,.2);color:var(--danger)}

/* Bottom nav */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,18,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.bottom-nav button{flex:1;max-width:140px;background:none;border:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px;cursor:pointer;border-radius:12px}
.bottom-nav .ic{font-size:20px;filter:grayscale(1);opacity:.6;transition:.15s}
.bottom-nav button.active{color:var(--accent)}
.bottom-nav button.active .ic{filter:none;opacity:1;transform:translateY(-1px)}

/* FAB */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(80px + env(safe-area-inset-bottom));z-index:21;height:56px;min-width:56px;padding:0 16px;border-radius:28px;border:none;background:var(--accent);color:#0d0f12;font-size:22px;font-weight:700;box-shadow:0 8px 24px rgba(182,255,59,.25);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform .1s}
.fab:active{transform:scale(.94)}
.fab .t{font-family:var(--num);font-size:24px}
.fab .t:empty{display:none}
.fab.done{animation:pulse .45s 6 alternate}
@keyframes pulse{to{transform:scale(1.15);box-shadow:0 0 0 10px rgba(182,255,59,.15)}}

/* Overlay / sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .25s;max-height:92vh;overflow:auto}
.overlay.open .sheet{transform:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-head h2{margin:0}
.ring{position:relative;width:200px;height:200px;margin:6px auto 14px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time .big{font-family:var(--num);font-size:56px;font-weight:600;line-height:1}
.ring .time .lbl{font-size:12px;color:var(--muted)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.chip{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 0;font-family:var(--num);font-size:18px;font-weight:600;cursor:pointer}
.chip.active{border-color:var(--accent);color:var(--accent)}
.custom-time{display:grid;grid-template-columns:1fr 80px;gap:8px;margin-bottom:12px}
.custom-time input{padding:10px}
.timer-ctrl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}

/* Confirm & banner */
#confirmOverlay{z-index:40;align-items:center;padding:16px}
.confirm-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 16px 16px;transform:scale(.96);transition:transform .2s}
#confirmOverlay.open .confirm-box{transform:none}
#confirmMsg{white-space:pre-line;margin-bottom:16px;font-size:15px}
.banner{max-width:528px;margin:8px auto 0;background:rgba(255,201,77,.1);border:1px solid rgba(255,201,77,.35);color:var(--gold);border-radius:12px;padding:10px 12px;font-size:13px}
.banner[hidden]{display:none}

/* Toast */
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-20px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.gold{border-color:var(--gold);color:var(--gold)}

@media (max-width:360px){.summary{grid-template-columns:1fr 1fr}.add-ex{grid-template-columns:1fr 80px}.add-ex .btn{grid-column:1/-1}}
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">Lift<span>Log</span></div>
  <div class="sub">重訓紀錄器</div>
</header>
<div class="banner" id="storageWarn" hidden>⚠️ 目前的開啟方式無法儲存資料（例如在預覽視窗中），重新整理後紀錄會消失。請用瀏覽器直接開啟，或部署到 GitHub Pages 後使用。</div>

<main>
  <!-- ===== 紀錄 ===== -->
  <section id="tab-log" class="tab active">
    <div class="card">
      <h2>新增一組</h2>
      <form id="logForm" novalidate>
        <label class="field"><span>日期</span><input type="date" id="fDate"></label>
        <div class="row pick">
          <label class="field"><span>部位</span><select id="fPart"></select></label>
          <label class="field"><span>動作</span><select id="fExercise"></select></label>
        </div>
        <div class="hint" id="lastHint"></div>
        <div class="row two">
          <div class="field"><span>重量 (kg)</span>
            <div class="stepper">
              <button type="button" data-step="fWeight" data-delta="-2.5" aria-label="減少重量">−</button>
              <input type="number" id="fWeight" inputmode="decimal" step="0.5" min="0" placeholder="0">
              <button type="button" data-step="fWeight" data-delta="2.5" aria-label="增加重量">+</button>
            </div>
          </div>
          <div class="field"><span>次數</span>
            <div class="stepper">
              <button type="button" data-step="fReps" data-delta="-1" aria-label="減少次數">−</button>
              <input type="number" id="fReps" inputmode="numeric" step="1" min="1" value="8">
              <button type="button" data-step="fReps" data-delta="1" aria-label="增加次數">+</button>
            </div>
          </div>
        </div>
        <label class="field"><span>備註（選填）</span><input type="text" id="fNote" maxlength="60" placeholder="例如：最後一下很吃力、RPE 8"></label>
        <div class="error" id="formError"></div>
        <div class="btn-row">
          <button type="button" class="btn ghost" id="btnRepeat">↺ 重複上組</button>
          <button type="button" class="btn primary" id="btnLog">＋ 記錄這組</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>歷史紀錄</h2>
        <select id="historyFilter" class="small-select" aria-label="篩選動作"></select>
      </div>
      <div id="historyList"></div>
    </div>
  </section>

  <!-- ===== 進度 ===== -->
  <section id="tab-progress" class="tab">
    <div class="card">
      <h2>進步曲線</h2>
      <label class="field"><span>動作</span><select id="pExercise"></select></label>
      <div class="seg" id="metricSeg">
        <button type="button" data-metric="e1rm" class="active">估算 1RM</button>
        <button type="button" data-metric="max">最大重量</button>
        <button type="button" data-metric="volume">訓練量</button>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <canvas id="progressChart"></canvas>
        <div class="empty" id="chartEmpty">尚無紀錄</div>
      </div>
      <div class="summary" id="progressSummary"></div>
    </div>
  </section>

  <!-- ===== 1RM ===== -->
  <section id="tab-1rm" class="tab">
    <div class="card">
      <h2>1RM 計算機</h2>
      <div class="row two">
        <div class="field"><span>重量 (kg)</span>
          <div class="stepper">
            <button type="button" data-step="cWeight" data-delta="-2.5" aria-label="減少重量">−</button>
            <input type="number" id="cWeight" inputmode="decimal" step="0.5" min="0" value="100">
            <button type="button" data-step="cWeight" data-delta="2.5" aria-label="增加重量">+</button>
          </div>
        </div>
        <div class="field"><span>次數</span>
          <div class="stepper">
            <button type="button" data-step="cReps" data-delta="-1" aria-label="減少次數">−</button>
            <input type="number" id="cReps" inputmode="numeric" step="1" min="1" value="5">
            <button type="button" data-step="cReps" data-delta="1" aria-label="增加次數">+</button>
          </div>
        </div>
      </div>
      <div id="calcResult"></div>
    </div>
    <div class="card">
      <h2>強度對照表</h2>
      <div id="pctTable"></div>
    </div>
  </section>

  <!-- ===== 統計 ===== -->
  <section id="tab-stats" class="tab">
    <div class="card">
      <h2>訓練總覽</h2>
      <div class="stat-grid" id="statGrid"></div>
    </div>
    <div class="card">
      <h2>個人紀錄 PR</h2>
      <div id="prTable"></div>
    </div>
    <div class="card">
      <h2>動作管理</h2>
      <form class="add-ex" id="addExForm" novalidate>
        <input type="text" id="newExName" maxlength="20" placeholder="新增自訂動作">
        <select id="newExPart"></select>
        <button type="button" class="btn primary" id="btnAddEx">新增</button>
      </form>
      <div class="tags" id="customList"></div>
    </div>
    <div class="card">
      <h2>資料管理</h2>
      <div class="btn-grid">
        <button type="button" class="btn ghost" id="btnExport">⬇ 匯出 JSON</button>
        <button type="button" class="btn ghost" id="btnImport">⬆ 匯入 JSON</button>
        <button type="button" class="btn ghost" id="btnSample">✨ 載入範例資料</button>
        <button type="button" class="btn danger" id="btnClear">清除全部資料</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <p class="muted-note">資料只存在這台裝置的瀏覽器中，換手機或清除瀏覽器資料前請先匯出備份。</p>
    </div>
  </section>
</main>

<nav class="bottom-nav" id="nav">
  <button type="button" data-tab="log" class="active"><span class="ic">📝</span>紀錄</button>
  <button type="button" data-tab="progress"><span class="ic">📈</span>進度</button>
  <button type="button" data-tab="1rm"><span class="ic">🧮</span>1RM</button>
  <button type="button" data-tab="stats"><span class="ic">🏆</span>統計</button>
</nav>

<button type="button" class="fab" id="timerFab" aria-label="休息計時器">⏱<span class="t" id="fabTime"></span></button>

<!-- Timer sheet -->
<div class="overlay" id="timerOverlay">
  <div class="sheet" role="dialog" aria-label="休息計時器">
    <div class="sheet-head">
      <h2>休息計時器</h2>
      <button type="button" class="icon-btn" data-close aria-label="關閉">✕</button>
    </div>
    <div class="ring">
      <svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="ringFg" cx="60" cy="60" r="54"/></svg>
      <div class="time"><div class="big" id="timerDisplay">1:30</div><div class="lbl" id="timerLabel">準備開始</div></div>
    </div>
    <div class="presets" id="presets">
      <button type="button" class="chip" data-sec="60">60s</button>
      <button type="button" class="chip" data-sec="90">90s</button>
      <button type="button" class="chip" data-sec="120">120s</button>
      <button type="button" class="chip" data-sec="180">180s</button>
    </div>
    <form class="custom-time" id="customTimeForm" novalidate>
      <input type="number" id="customSec" inputmode="numeric" min="5" max="3600" placeholder="自訂秒數（5–3600）">
      <button type="button" class="btn ghost" id="btnCustomSec">設定</button>
    </form>
    <div class="timer-ctrl">
      <button type="button" class="btn ghost" id="btnReset">重設</button>
      <button type="button" class="btn primary" id="btnStartPause">開始</button>
      <button type="button" class="btn ghost" id="btnPlus">+15s</button>
    </div>
    <label class="check"><input type="checkbox" id="autoStart"> 記錄一組後自動開始計時</label>
  </div>
</div>

<!-- Edit sheet -->
<div class="overlay" id="editOverlay">
  <div class="sheet" role="dialog" aria-label="編輯紀錄">
    <div class="sheet-head">
      <h2>編輯紀錄</h2>
      <button type="button" class="icon-btn" data-close aria-label="關閉">✕</button>
    </div>
    <form id="editForm" novalidate>
      <label class="field"><span>日期</span><input type="date" id="eDate"></label>
      <label class="field"><span>動作</span><select id="eExercise"></select></label>
      <div class="row two">
        <label class="field"><span>重量 (kg)</span><input type="number" id="eWeight" inputmode="decimal" step="0.5" min="0"></label>
        <label class="field"><span>次數</span><input type="number" id="eReps" inputmode="numeric" step="1" min="1"></label>
      </div>
      <label class="field"><span>備註</span><input type="text" id="eNote" maxlength="60"></label>
      <div class="error" id="editError"></div>
      <div class="btn-grid">
        <button type="button" class="btn ghost" data-close>取消</button>
        <button type="button" class="btn primary" id="btnEditSave">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm dialog（取代瀏覽器 confirm，預覽視窗中也能用） -->
<div class="overlay" id="confirmOverlay">
  <div class="confirm-box" role="alertdialog" aria-modal="true">
    <p id="confirmMsg"></p>
    <div class="btn-grid">
      <button type="button" class="btn ghost" id="confirmNo">取消</button>
      <button type="button" class="btn primary" id="confirmYes">確定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
'use strict';

/* ========== 常數與狀態 ========== */
const EXERCISE_GROUPS = {
  '胸': ['槓鈴臥推', '啞鈴臥推', '上斜槓鈴臥推', '上斜啞鈴臥推', '下斜臥推', '器械推胸', '器械夾胸', '繩索夾胸', '啞鈴飛鳥', '雙槓撐體', '伏地挺身'],
  '背': ['硬舉', '引體向上', '滑輪下拉', '槓鈴划船', '啞鈴單臂划船', '坐姿划船', 'T 槓划船', '器械划船', '直臂下拉', '背伸展'],
  '腿': ['槓鈴深蹲', '前蹲舉', '哈克深蹲', '腿推', '羅馬尼亞硬舉', '保加利亞分腿蹲', '弓箭步', '臀推', '腿伸展', '腿後勾', '小腿提踵'],
  '肩': ['槓鈴肩推', '啞鈴肩推', '器械肩推', '阿諾肩推', '側平舉', '繩索側平舉', '前平舉', '反向飛鳥', '器械反向飛鳥', '臉拉', '直立划船', '聳肩'],
  '二頭': ['槓鈴彎舉', '啞鈴彎舉', '錘式彎舉', '牧師椅彎舉', '集中彎舉', '上斜啞鈴彎舉', '繩索彎舉', '反握彎舉'],
  '三頭': ['繩索三頭下壓', '直桿三頭下壓', '仰臥三頭伸展', '過頭三頭伸展', '窄握臥推', '啞鈴三頭後伸', '凳上撐體'],
  '核心': ['捲腹', '繩索捲腹', '懸垂舉腿', '健腹輪', '俄羅斯轉體']
};
const PARTS = [...Object.keys(EXERCISE_GROUPS), '其他'];
const DEFAULT_EXERCISES = Object.entries(EXERCISE_GROUPS).flatMap(([part, names]) => names.map(name => ({ name, part })));
/* 舊版動作名稱對應到新名稱 */
const LEGACY_NAMES = { '上斜臥推': '上斜槓鈴臥推', '肩推': '槓鈴肩推', '二頭彎舉': '啞鈴彎舉', '三頭下壓': '繩索三頭下壓' };
const STORAGE_KEY = 'liftlog_v1';
const METRIC_LABEL = { e1rm: '估算 1RM', max: '最大重量', volume: '訓練量' };

let state = defaultState();
function defaultState() {
  return { sets: [], customExercises: [], settings: { restDefault: 90, autoStartTimer: true } };
}

/* ========== 工具函式 ========== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round = (n, d = 1) => Math.round(n * 10 ** d) / 10 ** d;
const fmt = (n, d = 1) => round(n, d).toLocaleString('zh-TW', { maximumFractionDigits: d });
const shortDate = iso => { const [, m, d] = iso.split('-'); return `${+m}/${+d}`; };
const weekday = iso => '日一二三四五六'[new Date(iso + 'T00:00:00').getDay()];
const fmtTime = sec => `${Math.floor(sec / 60)}:${pad(sec % 60)}`;

/* 1RM 公式 */
const epley = (w, r) => r === 1 ? w : w * (1 + r / 30);
const brzycki = (w, r) => r >= 37 ? NaN : (r === 1 ? w : w * 36 / (37 - r));
const e1rm = s => epley(s.weight, s.reps);

/* ========== 儲存 ========== */
function validSet(s) {
  return s && /^\d{4}-\d{2}-\d{2}$/.test(s.date) && s.exercise &&
    isFinite(+s.weight) && +s.weight >= 0 && isFinite(+s.reps) && +s.reps >= 1;
}
function normalize(d) {
  const out = defaultState();
  if (!d || typeof d !== 'object') return out;
  if (Array.isArray(d.sets)) {
    out.sets = d.sets.filter(validSet).map(s => ({
      id: String(s.id || uid()), date: s.date, exercise: LEGACY_NAMES[s.exercise] || String(s.exercise),
      weight: +s.weight, reps: Math.round(+s.reps), note: s.note ? String(s.note) : ''
    }));
  }
  if (Array.isArray(d.customExercises)) {
    const seen = new Set(DEFAULT_EXERCISES.map(e => e.name));
    d.customExercises.forEach(c => {
      if (c && c.name && !seen.has(String(c.name))) {
        seen.add(String(c.name));
        out.customExercises.push({ name: String(c.name), part: PARTS.includes(c.part) ? c.part : '其他' });
      }
    });
  }
  if (d.settings) {
    const r = +d.settings.restDefault;
    if (r >= 5 && r <= 3600) out.settings.restDefault = r;
    if (typeof d.settings.autoStartTimer === 'boolean') out.settings.autoStartTimer = d.settings.autoStartTimer;
  }
  return out;
}
let storageOK = true;
try { localStorage.setItem('__liftlog_test', '1'); localStorage.removeItem('__liftlog_test'); } catch (e) { storageOK = false; }
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = normalize(JSON.parse(raw));
  } catch (e) { /* 無法讀取時使用空資料 */ }
}
function save() {
  if (!storageOK) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { toast('⚠️ 無法儲存到瀏覽器，請先匯出備份'); }
}

/* ========== 資料查詢 ========== */
function allExercises() {
  const list = [
    ...DEFAULT_EXERCISES.map(e => ({ ...e, custom: false })),
    ...state.customExercises.map(e => ({ ...e, custom: true }))
  ];
  const names = new Set(list.map(e => e.name));
  state.sets.forEach(s => {
    if (!names.has(s.exercise)) { names.add(s.exercise); list.push({ name: s.exercise, part: '其他', custom: false }); }
  });
  return list;
}
/* 依日期排序；同一天依新增順序 */
function chrono() {
  return state.sets.map((s, i) => ({ s, i }))
    .sort((a, b) => a.s.date.localeCompare(b.s.date) || a.i - b.i)
    .map(x => x.s);
}
function lastSetOf(ex) {
  const c = chrono().filter(s => s.exercise === ex);
  return c[c.length - 1];
}
function bestE1(ex) {
  let best;
  state.sets.forEach(s => { if (s.exercise === ex && (best === undefined || e1rm(s) > best)) best = e1rm(s); });
  return best;
}
/* 找出創下 PR 的組（估算 1RM 超越先前所有紀錄） */
function prIds() {
  const best = {}, ids = new Set();
  chrono().forEach(s => {
    const v = e1rm(s), b = best[s.exercise];
    if (b !== undefined && v > b + 1e-9) ids.add(s.id);
    if (b === undefined || v > b) best[s.exercise] = v;
  });
  return ids;
}

/* ========== 共用 UI ========== */
let toastTimer;
function toast(msg, gold = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.toggle('gold', gold);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}
/* 自訂確認視窗：回傳 Promise<boolean> */
function askConfirm(msg, { ok = '確定', danger = false } = {}) {
  return new Promise(resolve => {
    const ov = $('#confirmOverlay'), yes = $('#confirmYes'), no = $('#confirmNo');
    $('#confirmMsg').textContent = msg;
    yes.textContent = ok;
    yes.className = 'btn ' + (danger ? 'danger' : 'primary');
    const done = v => { ov.classList.remove('open'); yes.onclick = no.onclick = ov.onclick = null; resolve(v); };
    yes.onclick = () => done(true);
    no.onclick = () => done(false);
    ov.onclick = e => { if (e.target === ov) done(false); };
    ov.classList.add('open');
    yes.focus();
  });
}
/* 按鈕點擊或在輸入框按 Enter 都會觸發（不依賴表單送出，預覽視窗中也能用） */
function bindAction(formSel, btnSel, fn) {
  const form = $(formSel);
  form.addEventListener('submit', e => { e.preventDefault(); fn(); });
  form.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); fn(); }
  });
  $(btnSel).addEventListener('click', fn);
}
function fillExerciseSelect(sel, { all = false, onlyData = false } = {}) {
  const prev = sel.value;
  const used = new Set(state.sets.map(s => s.exercise));
  const list = allExercises().filter(e => !onlyData || used.has(e.name));
  let html = all ? '<option value="">全部動作</option>' : '';
  PARTS.forEach(p => {
    const items = list.filter(e => e.part === p);
    if (items.length) {
      html += `<optgroup label="${p}">` +
        items.map(e => `<option value="${esc(e.name)}">${esc(e.name)}</option>`).join('') + '</optgroup>';
    }
  });
  sel.innerHTML = html;
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
  return list.length;
}
function openOverlay(id) { $(id).classList.add('open'); }
function closeOverlay(el) { el.classList.remove('open'); }
document.querySelectorAll('.overlay:not(#confirmOverlay)').forEach(ov => {
  ov.addEventListener('click', e => {
    if (e.target === ov || e.target.closest('[data-close]')) closeOverlay(ov);
  });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#confirmOverlay').classList.contains('open')) { $('#confirmNo').click(); return; }
  document.querySelectorAll('.overlay.open').forEach(closeOverlay);
});

/* 加減按鈕 */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-step]');
  if (!b) return;
  const input = document.getElementById(b.dataset.step);
  const delta = +b.dataset.delta;
  const min = input.id.endsWith('Reps') ? 1 : 0;
  const cur = input.value === '' ? (delta > 0 ? 0 : min) : +input.value;
  input.value = Math.max(min, round(cur + delta, 2));
  input.dispatchEvent(new Event('input', { bubbles: true }));
});

/* ========== 分頁 ========== */
let currentTab = 'log';
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  currentTab = b.dataset.tab;
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + currentTab));
  if (currentTab === 'progress') renderProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ========== F1 單組紀錄 ========== */
function readSetFields(p) {
  const date = $(`#${p}Date`).value;
  const exercise = $(`#${p}Exercise`).value;
  const wRaw = $(`#${p}Weight`).value.trim();
  const rRaw = $(`#${p}Reps`).value.trim();
  const note = $(`#${p}Note`).value.trim();
  if (!date) return { error: '請選擇日期' };
  if (!exercise) return { error: '請選擇動作' };
  if (wRaw === '' || !isFinite(+wRaw) || +wRaw < 0) return { error: '重量需為 0 以上的數字' };
  if (+wRaw > 1000) return { error: '重量超過 1000kg，請確認是否輸入錯誤' };
  if (rRaw === '' || !Number.isInteger(+rRaw) || +rRaw < 1) return { error: '次數需為 1 以上的整數' };
  if (+rRaw > 100) return { error: '次數超過 100，請確認是否輸入錯誤' };
  return { set: { date, exercise, weight: round(+wRaw, 2), reps: +rRaw, note } };
}
function updateLastHint() {
  const ex = $('#fExercise').value;
  const last = lastSetOf(ex);
  $('#lastHint').innerHTML = last
    ? `上次：<b>${fmt(last.weight)}kg × ${last.reps}</b>（${shortDate(last.date)}）・最佳估算 1RM <b>${fmt(bestE1(ex))}kg</b>`
    : '這個動作還沒有紀錄';
}
/* 部位 → 動作 兩層選單 */
function partOf(name) { const e = allExercises().find(x => x.name === name); return e ? e.part : null; }
function renderExerciseOptions(part, selected) {
  const items = allExercises().filter(e => e.part === part);
  const exSel = $('#fExercise');
  exSel.innerHTML = items.map(e => `<option value="${esc(e.name)}">${esc(e.name)}${e.custom ? '（自訂）' : ''}</option>`).join('');
  if (!selected || !items.some(e => e.name === selected)) {
    const recent = chrono().reverse().find(s => partOf(s.exercise) === part);
    selected = recent ? recent.exercise : (items[0] && items[0].name);
  }
  if (selected) exSel.value = selected;
  updateLastHint();
}
function fillLogSelects(name) {
  const partSel = $('#fPart');
  const target = name || $('#fExercise').value;
  const list = allExercises();
  const parts = PARTS.filter(p => list.some(e => e.part === p));
  const part = partOf(target) || partSel.value || parts[0];
  partSel.innerHTML = parts.map(p => `<option>${p}</option>`).join('');
  partSel.value = parts.includes(part) ? part : parts[0];
  renderExerciseOptions(partSel.value, target);
}
$('#fPart').addEventListener('change', () => renderExerciseOptions($('#fPart').value));
$('#fExercise').addEventListener('change', updateLastHint);

let flashId = null;
let historyDays = 5;
bindAction('#logForm', '#btnLog', () => {
  const r = readSetFields('f');
  $('#formError').textContent = r.error || '';
  if (r.error) { toast('⚠️ ' + r.error); return; }
  const prevBest = bestE1(r.set.exercise);
  const set = { id: uid(), ...r.set };
  state.sets.push(set);
  save();
  flashId = set.id;
  $('#fNote').value = '';
  $('#historyFilter').value = '';
  renderAll();
  if (prevBest !== undefined && e1rm(set) > prevBest + 1e-9) {
    toast(`🏆 新 PR！${set.exercise} 估算 1RM ${fmt(e1rm(set))}kg`, true);
  } else {
    toast(`✅ 已記錄：${set.exercise} ${fmt(set.weight)}kg × ${set.reps}`);
  }
  if (state.settings.autoStartTimer) startTimer(state.settings.restDefault);
});

$('#btnRepeat').addEventListener('click', () => {
  const ex = $('#fExercise').value;
  const last = lastSetOf(ex);
  if (!last) { toast('這個動作還沒有上一組可以重複'); return; }
  $('#fWeight').value = last.weight;
  $('#fReps').value = last.reps;
  $('#formError').textContent = '';
  toast(`已帶入上一組：${fmt(last.weight)}kg × ${last.reps}`);
});

/* ========== F2 歷史紀錄 ========== */
function renderHistory() {
  const f = $('#historyFilter').value;
  const prs = prIds();
  const sets = chrono().filter(s => !f || s.exercise === f).reverse();
  const box = $('#historyList');
  if (!sets.length) {
    box.innerHTML = state.sets.length
      ? '<div class="empty-block">這個動作沒有紀錄</div>'
      : '<div class="empty-block">還沒有任何紀錄 💪<br>新增第一組，或到「統計」分頁載入範例資料試玩。</div>';
    return;
  }
  const groups = [];
  sets.forEach(s => {
    const g = groups[groups.length - 1];
    if (g && g.date === s.date) g.sets.push(s); else groups.push({ date: s.date, sets: [s] });
  });
  const shown = groups.slice(0, historyDays);
  box.innerHTML = shown.map(g => {
    const vol = g.sets.reduce((a, s) => a + s.weight * s.reps, 0);
    const rows = g.sets.map(s => `
      <div class="set-row${s.id === flashId ? ' flash' : ''}">
        <div class="set-main">
          <div class="set-ex">${esc(s.exercise)}${prs.has(s.id) ? '<span class="pr">🏆 PR</span>' : ''}</div>
          <div class="set-meta">${fmt(s.weight)}kg × ${s.reps}<span class="e">1RM≈${fmt(e1rm(s))}</span></div>
          ${s.note ? `<div class="set-note">${esc(s.note)}</div>` : ''}
        </div>
        <button type="button" class="icon-btn" data-edit="${esc(s.id)}" aria-label="編輯">✎</button>
        <button type="button" class="icon-btn" data-del="${esc(s.id)}" aria-label="刪除">🗑</button>
      </div>`).join('');
    return `<div class="day">
      <div class="day-head"><b>${shortDate(g.date)}（${weekday(g.date)}）</b><span>${g.sets.length} 組・${fmt(vol, 0)} kg</span></div>
      ${rows}</div>`;
  }).join('') + (groups.length > historyDays
    ? `<button type="button" class="btn ghost more-btn" id="btnMore">顯示更早的紀錄（還有 ${groups.length - historyDays} 天）</button>` : '');
  flashId = null;
}
$('#historyFilter').addEventListener('change', () => { historyDays = 5; renderHistory(); });

$('#historyList').addEventListener('click', async e => {
  const del = e.target.closest('[data-del]');
  const edit = e.target.closest('[data-edit]');
  if (del) {
    const s = state.sets.find(x => x.id === del.dataset.del);
    if (!s) return;
    if (!await askConfirm(`確定刪除這組紀錄？\n${s.exercise} ${fmt(s.weight)}kg × ${s.reps}（${shortDate(s.date)}）`, { ok: '刪除', danger: true })) return;
    state.sets = state.sets.filter(x => x.id !== s.id);
    save(); renderAll();
    toast('🗑 已刪除');
  } else if (edit) {
    openEdit(edit.dataset.edit);
  } else if (e.target.closest('#btnMore')) {
    historyDays += 5; renderHistory();
  }
});

let editingId = null;
function openEdit(id) {
  const s = state.sets.find(x => x.id === id);
  if (!s) return;
  editingId = id;
  fillExerciseSelect($('#eExercise'));
  $('#eDate').value = s.date;
  $('#eExercise').value = s.exercise;
  $('#eWeight').value = s.weight;
  $('#eReps').value = s.reps;
  $('#eNote').value = s.note || '';
  $('#editError').textContent = '';
  openOverlay('#editOverlay');
}
bindAction('#editForm', '#btnEditSave', () => {
  const r = readSetFields('e');
  $('#editError').textContent = r.error || '';
  if (r.error) return;
  const i = state.sets.findIndex(x => x.id === editingId);
  if (i < 0) return;
  state.sets[i] = { ...state.sets[i], ...r.set };
  flashId = editingId;
  save(); renderAll();
  closeOverlay($('#editOverlay'));
  toast('✏️ 已更新紀錄');
});

/* ========== F4 進步曲線 ========== */
let chart = null;
let metric = 'e1rm';
function seriesFor(ex, m) {
  const byDate = {};
  state.sets.filter(s => s.exercise === ex).forEach(s => {
    const d = byDate[s.date] || (byDate[s.date] = { e1rm: 0, max: 0, volume: 0 });
    d.e1rm = Math.max(d.e1rm, e1rm(s));
    d.max = Math.max(d.max, s.weight);
    d.volume += s.weight * s.reps;
  });
  const dates = Object.keys(byDate).sort();
  return { dates, values: dates.map(d => round(byDate[d][m], 1)) };
}
function renderProgress() {
  const sel = $('#pExercise');
  const hadValue = sel.value;
  const n = fillExerciseSelect(sel, { onlyData: true });
  const wrap = $('#chartWrap'), summary = $('#progressSummary');
  if (!n) {
    sel.innerHTML = '<option value="">（尚無紀錄）</option>';
    wrap.classList.add('is-empty');
    $('#chartEmpty').textContent = '尚無紀錄，先到「紀錄」分頁新增幾組吧！';
    summary.innerHTML = '';
    if (chart) { chart.destroy(); chart = null; }
    return;
  }
  if (!hadValue) {
    const days = {};
    state.sets.forEach(s => (days[s.exercise] = days[s.exercise] || new Set()).add(s.date));
    const top = Object.entries(days).sort((a, b) => b[1].size - a[1].size)[0];
    if (top) sel.value = top[0];
  }
  const { dates, values } = seriesFor(sel.value, metric);
  if (typeof Chart === 'undefined') {
    wrap.classList.add('is-empty');
    $('#chartEmpty').textContent = '圖表元件載入失敗，請確認網路連線後重新整理';
  } else {
    wrap.classList.remove('is-empty');
    const canvas = $('#progressChart');
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 260);
    grad.addColorStop(0, 'rgba(182,255,59,.35)');
    grad.addColorStop(1, 'rgba(182,255,59,0)');
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: dates.map(shortDate),
        datasets: [{
          label: METRIC_LABEL[metric], data: values,
          borderColor: '#b6ff3b', backgroundColor: grad, fill: true, tension: .3,
          pointRadius: 4, pointHoverRadius: 6, pointBackgroundColor: '#0d0f12', pointBorderColor: '#b6ff3b', pointBorderWidth: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { title: it => dates[it[0].dataIndex], label: it => `${METRIC_LABEL[metric]}：${fmt(it.parsed.y)} kg` } }
        },
        scales: {
          x: { ticks: { color: '#8a93a2' }, grid: { color: 'rgba(255,255,255,.05)' } },
          y: { ticks: { color: '#8a93a2', callback: v => v + 'kg' }, grid: { color: 'rgba(255,255,255,.05)' } }
        }
      }
    });
  }
  const first = values[0], last = values[values.length - 1];
  const diff = last - first;
  const pct = first > 0 ? diff / first * 100 : 0;
  const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
  summary.innerHTML = `
    <div class="stat"><div class="label">最新</div><div class="val">${fmt(last)}<small>kg</small></div></div>
    <div class="stat"><div class="label">最佳</div><div class="val">${fmt(Math.max(...values))}<small>kg</small></div></div>
    <div class="stat"><div class="label">${dates.length} 次訓練・變化</div><div class="val ${cls}">${diff >= 0 ? '+' : ''}${fmt(pct)}<small>%</small></div></div>`;
}
$('#pExercise').addEventListener('change', renderProgress);
$('#metricSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-metric]');
  if (!b) return;
  metric = b.dataset.metric;
  document.querySelectorAll('#metricSeg button').forEach(x => x.classList.toggle('active', x === b));
  renderProgress();
});

/* ========== F5 1RM 計算機 ========== */
function renderCalc() {
  const w = +$('#cWeight').value, r = +$('#cReps').value;
  const out = $('#calcResult'), table = $('#pctTable');
  if (!(w > 0) || !Number.isInteger(r) || r < 1) {
    out.innerHTML = '<div class="empty-block">請輸入重量（&gt; 0）與次數（1 以上的整數）</div>';
    table.innerHTML = '<div class="empty-block">輸入後會顯示各強度對應的重量</div>';
    return;
  }
  const ep = epley(w, r), br = brzycki(w, r);
  out.innerHTML = `
    <div class="calc-out">
      <div class="calc-hero"><div class="label">估算 1RM（Epley）</div><div class="val">${fmt(ep)}<small>kg</small></div></div>
      <div class="stat"><div class="label">Epley：w × (1 + r/30)</div><div class="val">${fmt(ep)}<small>kg</small></div></div>
      <div class="stat"><div class="label">Brzycki：w × 36/(37 − r)</div><div class="val">${isNaN(br) ? '—' : fmt(br)}<small>${isNaN(br) ? '' : 'kg'}</small></div></div>
    </div>
    ${r > 10 ? '<div class="warn">⚠️ 次數超過 10 下，公式估算誤差較大，僅供參考。</div>' : ''}
    ${r === 1 ? '<div class="muted-note">做 1 下時，1RM 即為該重量。</div>' : ''}`;
  const rows = [];
  for (let p = 95; p >= 50; p -= 5) {
    const kg = Math.round(ep * p / 100 * 2) / 2;
    const reps = Math.max(1, Math.round(30 * (100 / p - 1)));
    rows.push(`<tr${p === 80 ? ' class="hl"' : ''}>
      <td class="num">${p}%</td>
      <td class="num">${fmt(kg)} <span class="sm">kg</span></td>
      <td class="num">≈${reps} <span class="sm">下</span></td>
      <td style="width:30%"><div class="bar" style="width:${p}%"></div></td></tr>`);
  }
  table.innerHTML = `<table><thead><tr><th>強度</th><th>重量</th><th>約可做</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table>
    <p class="muted-note">以 Epley 估算值為基準，重量取至 0.5kg；「約可做」為反推的最多次數。</p>`;
}
$('#cWeight').addEventListener('input', renderCalc);
$('#cReps').addEventListener('input', renderCalc);

/* ========== F6 休息計時器 ========== */
const RING_C = 2 * Math.PI * 54;
const timer = { total: 90, remaining: 90, endAt: 0, running: false, iv: null };
let audioCtx = null;
$('#ringFg').style.strokeDasharray = RING_C;

function ensureAudio() {
  try {
    if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* 不支援音效 */ }
}
function beep() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [0, 0.3, 0.6].forEach((dt, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = i === 2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001, t0 + dt);
    g.gain.exponentialRampToValueAtTime(0.4, t0 + dt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.25);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0 + dt); o.stop(t0 + dt + 0.27);
  });
}
function setTimer(sec) {
  clearInterval(timer.iv);
  timer.total = sec; timer.remaining = sec; timer.running = false;
  renderTimer();
}
function startTimer(sec) {
  ensureAudio();
  if (sec) { timer.total = sec; timer.remaining = sec; }
  if (timer.remaining <= 0) timer.remaining = timer.total;
  timer.endAt = Date.now() + timer.remaining * 1000;
  timer.running = true;
  clearInterval(timer.iv);
  timer.iv = setInterval(tick, 200);
  $('#timerFab').classList.remove('done');
  renderTimer();
}
function pauseTimer() {
  if (!timer.running) return;
  timer.remaining = Math.max(0, (timer.endAt - Date.now()) / 1000);
  timer.running = false;
  clearInterval(timer.iv);
  renderTimer();
}
function tick() {
  timer.remaining = Math.max(0, (timer.endAt - Date.now()) / 1000);
  if (timer.remaining <= 0) {
    timer.running = false;
    clearInterval(timer.iv);
    beep();
    if (navigator.vibrate) navigator.vibrate([300, 120, 300]);
    toast('⏰ 休息結束，下一組！');
    const fab = $('#timerFab');
    fab.classList.remove('done'); void fab.offsetWidth; fab.classList.add('done');
  }
  renderTimer();
}
function renderTimer() {
  const sec = Math.ceil(timer.remaining);
  $('#timerDisplay').textContent = fmtTime(sec);
  $('#ringFg').style.strokeDashoffset = RING_C * (1 - (timer.total ? timer.remaining / timer.total : 0));
  const paused = !timer.running && timer.remaining > 0 && timer.remaining < timer.total;
  $('#btnStartPause').textContent = timer.running ? '暫停' : paused ? '繼續' : '開始';
  $('#timerLabel').textContent = timer.running ? '休息中…' : timer.remaining <= 0 ? '時間到！' : paused ? '已暫停' : '準備開始';
  $('#fabTime').textContent = (timer.running || paused) ? fmtTime(sec) : '';
  document.querySelectorAll('#presets .chip').forEach(c => c.classList.toggle('active', +c.dataset.sec === state.settings.restDefault));
  $('#autoStart').checked = state.settings.autoStartTimer;
}
$('#timerFab').addEventListener('click', () => { ensureAudio(); openOverlay('#timerOverlay'); });
$('#presets').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  state.settings.restDefault = +c.dataset.sec; save();
  setTimer(+c.dataset.sec);
});
bindAction('#customTimeForm', '#btnCustomSec', () => {
  const v = +$('#customSec').value;
  if (!Number.isInteger(v) || v < 5 || v > 3600) { toast('請輸入 5～3600 之間的整數秒數'); return; }
  state.settings.restDefault = v; save();
  setTimer(v);
  $('#customSec').value = '';
  toast(`休息時間設為 ${fmtTime(v)}`);
});
$('#btnStartPause').addEventListener('click', () => timer.running ? pauseTimer() : startTimer());
$('#btnReset').addEventListener('click', () => setTimer(timer.total));
$('#btnPlus').addEventListener('click', () => {
  timer.total += 15;
  if (timer.running) timer.endAt += 15000; else timer.remaining += 15;
  renderTimer();
});
$('#autoStart').addEventListener('change', e => { state.settings.autoStartTimer = e.target.checked; save(); });

/* ========== F7 統計與資料管理 ========== */
function renderStats() {
  const sets = state.sets;
  const days = new Set(sets.map(s => s.date)).size;
  const vol = sets.reduce((a, s) => a + s.weight * s.reps, 0);
  const now = new Date();
  const monday = toISO(new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay() + 6) % 7));
  const weekVol = sets.filter(s => s.date >= monday).reduce((a, s) => a + s.weight * s.reps, 0);
  $('#statGrid').innerHTML = `
    <div class="stat"><div class="label">訓練天數</div><div class="val">${days}<small>天</small></div></div>
    <div class="stat"><div class="label">總組數</div><div class="val">${sets.length}<small>組</small></div></div>
    <div class="stat"><div class="label">總訓練量</div><div class="val">${fmt(vol, 0)}<small>kg</small></div></div>
    <div class="stat"><div class="label">本週訓練量</div><div class="val">${fmt(weekVol, 0)}<small>kg</small></div></div>`;

  const per = {};
  sets.forEach(s => {
    const p = per[s.exercise] || (per[s.exercise] = { maxW: null, best: null });
    if (!p.maxW || s.weight > p.maxW.weight || (s.weight === p.maxW.weight && s.reps > p.maxW.reps)) p.maxW = s;
    if (!p.best || e1rm(s) > e1rm(p.best)) p.best = s;
  });
  const rows = Object.entries(per).sort((a, b) => e1rm(b[1].best) - e1rm(a[1].best));
  $('#prTable').innerHTML = rows.length ? `<table>
    <thead><tr><th>動作</th><th>最大重量</th><th>最佳估算 1RM</th></tr></thead>
    <tbody>${rows.map(([ex, p]) => `<tr>
      <td>${esc(ex)}</td>
      <td class="num">${fmt(p.maxW.weight)}<span class="sm"> kg × ${p.maxW.reps}</span></td>
      <td class="num">${fmt(e1rm(p.best))}<span class="sm"> kg・${shortDate(p.best.date)}</span></td></tr>`).join('')}
    </tbody></table>` : '<div class="empty-block">還沒有 PR，開始記錄吧！</div>';
}

function renderCustomList() {
  const box = $('#customList');
  box.innerHTML = state.customExercises.length
    ? state.customExercises.map((c, i) => `<span class="tag">${esc(c.name)} <em>${c.part}</em><button type="button" data-rm="${i}" aria-label="刪除 ${esc(c.name)}">✕</button></span>`).join('')
    : `<span class="set-note">尚未新增自訂動作。內建 ${DEFAULT_EXERCISES.length} 個動作，涵蓋胸、背、腿、肩、二頭、三頭、核心。</span>`;
}
$('#newExPart').innerHTML = PARTS.map(p => `<option>${p}</option>`).join('');
bindAction('#addExForm', '#btnAddEx', () => {
  const name = $('#newExName').value.trim();
  if (!name) { toast('請輸入動作名稱'); return; }
  const exists = [...DEFAULT_EXERCISES, ...state.customExercises].some(x => x.name === name);
  if (exists) { toast('這個動作已經存在'); return; }
  state.customExercises.push({ name, part: $('#newExPart').value });
  save();
  $('#newExName').value = '';
  renderAll();
  fillLogSelects(name);
  toast(`已新增動作：${name}（${partOf(name)}）`);
});
$('#customList').addEventListener('click', async e => {
  const b = e.target.closest('[data-rm]');
  if (!b) return;
  const c = state.customExercises[+b.dataset.rm];
  if (!c) return;
  const n = state.sets.filter(s => s.exercise === c.name).length;
  const msg = n ? `刪除「${c.name}」？\n已有的 ${n} 筆紀錄會保留，並歸類到「其他」。` : `刪除自訂動作「${c.name}」？`;
  if (!await askConfirm(msg, { ok: '刪除', danger: true })) return;
  state.customExercises.splice(+b.dataset.rm, 1);
  save(); renderAll();
});

$('#btnExport').addEventListener('click', () => {
  if (!state.sets.length && !state.customExercises.length) { toast('目前沒有資料可以匯出'); return; }
  const payload = { app: 'LiftLog', version: 1, exportedAt: new Date().toISOString(), ...state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `liftlog-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`⬇ 已匯出 ${state.sets.length} 筆紀錄`);
});
$('#btnImport').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (err) { toast('❌ 檔案不是有效的 JSON'); return; }
    if (!data || !Array.isArray(data.sets)) { toast('❌ 找不到紀錄資料，請確認是 LiftLog 匯出的檔案'); return; }
    const next = normalize(data);
    const skipped = data.sets.length - next.sets.length;
    if (!await askConfirm(`將匯入 ${next.sets.length} 筆紀錄${skipped ? `（${skipped} 筆格式錯誤會略過）` : ''}，並取代目前的資料。`, { ok: '匯入' })) return;
    state = next;
    save(); setTimer(state.settings.restDefault); renderAll();
    toast(`⬆ 已匯入 ${next.sets.length} 筆紀錄`);
  };
  reader.readAsText(file);
});
$('#btnClear').addEventListener('click', async () => {
  if (!state.sets.length && !state.customExercises.length) { toast('目前沒有資料'); return; }
  if (!await askConfirm('確定要清除全部資料嗎？\n建議先匯出備份。', { ok: '清除', danger: true })) return;
  if (!await askConfirm('再次確認：清除後無法復原！', { ok: '永久清除', danger: true })) return;
  state = defaultState();
  save(); setTimer(state.settings.restDefault); renderAll();
  toast('已清除全部資料');
});

/* 範例資料：過去 6 週、每 3 天一次，A/B 課表交替並漸進加重 */
function sampleSets() {
  const out = [], now = new Date();
  const mk = (date, exercise, weight, reps, note = '') => ({ id: uid(), date, exercise, weight, reps, note });
  let a = 0, b = 0;
  for (let i = 0; i < 14; i++) {
    const date = toISO(new Date(now.getFullYear(), now.getMonth(), now.getDate() - (13 - i) * 3));
    if (i % 2 === 0) {
      const sq = 80 + a * 2.5, bp = 60 + Math.floor(a / 2) * 2.5;
      [5, 5, a % 3 === 2 ? 4 : 5].forEach(r => out.push(mk(date, '槓鈴深蹲', sq, r)));
      [5, 5, a % 2 ? 4 : 5].forEach(r => out.push(mk(date, '槓鈴臥推', bp, r)));
      a++;
    } else {
      const dl = 100 + b * 5, row = 50 + b * 2.5, op = 35 + Math.floor(b / 2) * 2.5;
      [5, 5].forEach(r => out.push(mk(date, '硬舉', dl, r, b === 6 && r === 5 ? '狀態很好' : '')));
      [8, 8, 8].forEach(r => out.push(mk(date, '槓鈴划船', row, r)));
      [6, 6, 5].forEach(r => out.push(mk(date, '槓鈴肩推', op, r)));
      b++;
    }
  }
  return out;
}
$('#btnSample').addEventListener('click', async () => {
  if (state.sets.length && !await askConfirm('載入範例資料會取代目前的紀錄，確定？', { ok: '載入' })) return;
  state.sets = sampleSets();
  save(); renderAll(); fillLogSelects(chrono().pop().exercise);
  toast(`✨ 已載入 ${state.sets.length} 筆範例紀錄`);
});

/* ========== 初始化 ========== */
function renderAll() {
  fillLogSelects();
  fillExerciseSelect($('#historyFilter'), { all: true, onlyData: true });
  renderHistory();
  renderStats();
  renderCustomList();
  if (currentTab === 'progress') renderProgress();
}

load();
$('#fDate').value = todayISO();
renderAll();
const lastAny = chrono().pop();
if (lastAny) fillLogSelects(lastAny.exercise);
if (!storageOK) $('#storageWarn').hidden = false;
setTimer(state.settings.restDefault);
renderCalc();
})();
</script>
